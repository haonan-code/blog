baseurl: https://blog.haonan.de
languageCode: zh-cn
theme: papermod
title: Haonan's Blog
copyright: Haonan's Blog

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
  zh-cn:
    languageName: 简体中文
    title: Haonan's Blog
    weight: 2

services:
  # Change it to your Disqus shortname before using
  disqus:
    shortname: "hugo-theme-stack"
  # GA Tracking ID
  googleAnalytics:
    id:

pagination:
  pagerSize: 4

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  # Papermod 特定参数
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  comments: false
  defaultTheme: auto
  disableThemeToggle: false

  profileMode:
    enabled: false
    title: Haonan's Blog
    subtitle: 欢迎来到我的网站
    imageUrl: /img/avatar.png
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags
      - name: Archives
        url: archives

  homeInfoParams:
    Title: 欢迎来到我的网站
    Content: 这是一个关于技术的博客

  socialIcons:
    - name: GitHub
      url: https://github.com/haonan-code
    - name: Twitter
      url: https://x.com/HelloPanda5678

  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
    safari_pinned_tab: /logo.svg

  label:
    text: Haonan's Blog
    icon: /apple-touch-icon.png
    iconHeight: 35

  # 保留兼容配置
  mainSections:
    - post
  rssFullContent: true

### Custom menu
### See https://github.com/adityatelange/hugo-PaperMod/wiki/Features#menu
menu:
  main:
    - name: 归档
      url: archives
      weight: 5
    - name: 标签
      url: tags
      weight: 10
    - name: 关于
      url: about
      weight: 15
    - name: 搜索
      url: search
      weight: 20

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100

    - name: categories
      weight: 200

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
    renderer:
      ## Set to true if you have HTML content inside Markdown
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

# Enable global emoji support
enableEmoji: true
