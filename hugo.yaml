baseURL: https://blog.haonan.de
languageCode: zh-cn
title: "Haonan's Blog"
theme: PaperMod
copyright: "Haonan's Blog"

defaultContentLanguage: zh-cn
hasCJKLanguage: true
enableEmoji: true
enableRobotsTXT: true

# --------------------------------------------------
# 构建行为
# --------------------------------------------------

buildDrafts: false
buildFuture: false
buildExpired: false

# --------------------------------------------------
# 分页
# --------------------------------------------------

pagination:
  pagerSize: 6

# --------------------------------------------------
# 输出格式（搜索必须）
# --------------------------------------------------

outputs:
  home:
    - HTML
    - RSS
    - JSON

# --------------------------------------------------
# 永久链接（PaperMod 推荐）
# --------------------------------------------------

permalinks:
  posts: /p/:slug/

# --------------------------------------------------
# 多语言（保留但简化）
# --------------------------------------------------

languages:
  zh-cn:
    languageName: 简体中文
    weight: 1

# --------------------------------------------------
# PaperMod 参数
# --------------------------------------------------

params:

  env: production
  author: Haonan
  description: "记录技术、编程与工程实践"

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true

  comments: false

  # --------------------------
  # 首页（文章列表模式）
  # --------------------------

  homeInfoParams:
    Title: "欢迎来到 Haonan's Blog"
    Content: "这里记录后端、系统与工程实践相关内容。"

  # --------------------------
  # Profile 模式（关闭）
  # --------------------------

  profileMode:
    enabled: false

  # --------------------------
  # 社交链接
  # --------------------------

  socialIcons:
    - name: github
      url: https://github.com/haonan-code
    - name: twitter
      url: https://x.com/HelloPanda5678

  # --------------------------
  # Logo
  # --------------------------

  label:
    text: "Haonan's Blog"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # --------------------------
  # RSS
  # --------------------------

  rssFullContent: true

  # --------------------------
  # 主文章区
  # --------------------------

  mainSections:
    - posts

# --------------------------------------------------
# 菜单
# --------------------------------------------------

menu:
  main:
    - name: 首页
      url: /
      weight: 1

    - name: 归档
      url: /archives/
      weight: 2

    - name: 标签
      url: /tags/
      weight: 3

    - name: 搜索
      url: /search/
      weight: 4

    - name: 关于
      url: /about/
      weight: 5


# --------------------------------------------------
# 相关文章（可保留）
# --------------------------------------------------

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200

# --------------------------------------------------
# Markdown 渲染
# --------------------------------------------------

markup:
  goldmark:
    renderer:
      unsafe: true

  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: true

  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
